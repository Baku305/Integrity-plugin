name: Validate Integrity package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Validate public package
        run: node --test tests/package.test.mjs

      - name: Lint peer skills with Vally
        shell: bash
        env:
          DO_NOT_TRACK: "1"
          VALLY_TELEMETRY_OPTOUT: "1"
        run: |
          for skill_dir in skills/*; do
            npx --yes @microsoft/vally-cli@0.15.0 lint "$skill_dir" --verbose
          done
